[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pokemontcgapi"
dynamic = ["version"]
description = "Python client for the pokemontcgapi.com Pokémon TCG API: cards, sets, artists, images and prices with stated provenance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "pokemontcgapi.com" }]
keywords = ["pokemon", "pokemon-tcg", "tcg", "trading-cards", "api", "sdk", "card-prices", "japanese-cards"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "typing_extensions>=4.5; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "build", "twine"]

[project.urls]
Homepage = "https://pokemontcgapi.com/sdk"
Documentation = "https://pokemontcgapi.com/docs"
Repository = "https://github.com/pokemontcgapi/sdk-python"
Issues = "https://github.com/pokemontcgapi/sdk-python/issues"

[tool.hatch.version]
path = "src/pokemontcgapi/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src/pokemontcgapi", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/pokemontcgapi"]

[tool.ruff]
line-length = 120
target-version = "py310"
# The shared fixtures (packages/fixtures in the monorepo, tests/fixtures in the public repo) are data
# plus their generator, not package code: they are not linted here.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "A", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
