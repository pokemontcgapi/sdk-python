name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e .[dev]
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: pytest
      - run: python -m build
      - run: twine check dist/*
      # The Python twin of `npm pack --dry-run`: the wheel installs and imports in a clean environment.
      - shell: bash
        run: |
          python -m venv /tmp/clean
          if [ -x /tmp/clean/bin/python ]; then PY=/tmp/clean/bin/python; else PY=/tmp/clean/Scripts/python.exe; fi
          $PY -m pip install --quiet dist/*.whl
          $PY -c "import pokemontcgapi; print(pokemontcgapi.__version__)"
